spring.application.name=portfolio

# Railway (and most PaaS hosts) inject PORT at runtime; default to 8080 locally
server.port=${PORT:8080}

# Comma separated list of origins allowed to call the API, e.g.
# https://your-portfolio.vercel.app,http://localhost:5173
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Optional: email notifications for the contact form ---
# Leave these unset and the form will still work, it just won't email you.
# For Gmail: use an "app password", not your normal password.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

contact.mail.from=${MAIL_FROM:no-reply@utkarsh-portfolio.dev}
contact.notify.to=${CONTACT_NOTIFY_TO:}
